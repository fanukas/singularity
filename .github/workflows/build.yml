name: Build

# One run per push to main (or by hand). Branches don't build, and a newer push cancels an older run.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Engine tests (pacing, scenarios, saves)
        run: |
          set -o pipefail
          gradle :engine:test --no-daemon 2>&1 | tee test.log

      - name: Pacing report
        if: always()
        run: |
          grep -ho 'PACING[^<]*\|SCENARIOS[^<]*' test.log | sort -u | while read -r line; do
            echo "::notice title=Pacing::${line}"
          done || true

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Report errors as annotations
        if: failure()
        run: |
          cat test.log build.log 2>/dev/null | grep -E '^e: |error:|What went wrong|FAILED|IllegalStateException' -A2 | grep -v '^--$' | head -80 > errs.txt || true
          split -l 8 errs.txt chunk_ || true
          for f in chunk_*; do
            [ -f "$f" ] || continue
            msg=$(sed 's/%/%25/g' "$f" | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error::${msg}"
          done

      - name: Publish as a release (direct .apk download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}
          cp app/build/outputs/apk/debug/app-debug.apk "singularity-$N.apk"
          gh release create "build-$N" "singularity-$N.apk" \
            --title "Build $N" \
            --notes "Debug APK from ${GITHUB_SHA::7}. Install over the previous build; the save is kept." \
            --target "$GITHUB_SHA"
